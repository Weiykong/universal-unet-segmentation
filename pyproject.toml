[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-unet"
version = "0.1.0"
description = "Universal U-Net segmentation — napari plugin"
requires-python = ">=3.9"
dependencies = [
    "napari>=0.5.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "tifffile>=2023.0.0",
    "numpy>=1.24",
    "tqdm",
    "Pillow>=9.0.0",
    "magicgui",
    "qtpy",
]

[project.entry-points."napari.manifest"]
universal-unet = "universal_unet:napari.yaml"

[tool.setuptools.packages.find]
where = ["."]
include = ["universal_unet*"]

[tool.setuptools.package-data]
universal_unet = ["napari.yaml"]
